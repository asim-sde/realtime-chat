version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: chat_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  app1:
    build: .
    ports:
      - "8081:8080"
    environment:
      - DB_URL=postgres://user:password@postgres:5432/chat_db?sslmode=disable
      - REDIS_URL=redis:6379
      - PORT=8080
      - SERVER_ID=server1
    depends_on:
      - postgres
      - redis

  app2:
    build: .
    ports:
      - "8082:8080"
    environment:
      - DB_URL=postgres://user:password@postgres:5432/chat_db?sslmode=disable
      - REDIS_URL=redis:6379
      - PORT=8080
      - SERVER_ID=server2
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  redis_data:
